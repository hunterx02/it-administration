<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Assets</title>
  <meta name="author" content="Eng. Mahmoud Ebrahim">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>.tb-logo img { height: 36px; }</style>
  <!-- هوية الشركة (الاسم واللوجو): js/brand.js -->
  <script src="js/brand.js"></script>
  <script>
    // نظام تقنية المعلومات — نسخة مستقلة (إدارة الأصول والتجديدات + دورة الموظف)
    document.title = BRAND.title + ' · ' + BRAND.company;
    window.APP = {
      id: 'it', home: 'itdash', label: BRAND.companyEn + ' · ' + BRAND.title,
      sub: BRAND.title.toUpperCase(), t1: 'إدارة الأصول', t2: 'والتجديدات', tagline: BRAND.tagline,
      hint: 'حساب IT تجريبي: <b dir="ltr">it@example.com</b> / <b dir="ltr">It@12345</b> · HR: <b dir="ltr">hr@example.com</b> / <b dir="ltr">Hr@12345</b> · المدير: <b dir="ltr">admin@example.com</b> / <b dir="ltr">Admin@123</b>',
      pages: ['itdash', 'renewals', 'alerts', 'assets', 'asset', 'mobiles', 'consumables', 'maint', 'stocktake', 'lines', 'linesSA', 'linesEG', 'net', 'mail', 'tools', 'tool', 'subs', 'sub', 'domains',
        'reqs', 'cands', 'cand', 'onboard', 'offboard', 'cycle', 'docs', 'staff', 'holder', 'moves', 'move', 'security', 'backup', 'vendors', 'cost', 'itlog', 'syncerr', 'itsettings'],
      // M01: ست مجموعات رئيسية فقط — الرئيسية = Dashboard وحدها. أكواد الصفحات القديمة كما هي (الروابط المحفوظة لا تنكسر).
      // صفحة التنبيهات (alerts) ما زالت متاحة من الداشبورد «كل التنبيهات».
      nav: [
        { group: 'الرئيسية', items: [['itdash', '📊', 'Dashboard']] },
        { group: 'الأصول والعهد', items: [['assets', '💻', 'الأجهزة'], ['mobiles', '📱', 'الموبايلات'], ['consumables', '🎧', 'الإكسسوارات والمستهلكات'], ['stocktake', '📋', 'المخازن والجرد'], ['maint', '🔧', 'الصيانة والضمان']] },
        { group: 'رحلة الموظف', items: [['staff', '👥', 'الموظفون'], ['reqs', '📋', 'طلبات الاحتياج'], ['cands', '🧑‍💼', 'التوظيف والمقابلات'], ['onboard', '🟢', 'التعيينات (0 – 8)'], ['offboard', '🚪', 'إخلاء الطرف (X1 – X9)'], ['docs', '📄', 'المستندات والإقرارات']] },
        { group: 'الخدمات التقنية', items: [['renewals', '🔁', 'مركز التجديدات'], ['net', '🌐', 'الإنترنت والأرضي'], ['linesEG', '🇪🇬', 'الشرائح المصرية'], ['linesSA', '🇸🇦', 'الشرائح السعودية'], ['mail', '✉️', 'الإيميلات والحسابات'], ['tools', '🧩', 'التولات والتوكنات'], ['subs', '🪪', 'الاشتراكات والتراخيص'], ['domains', '🔐', 'الدومينات و SSL والهوستنج'], ['security', '🛡️', 'الأمان'], ['backup', '💾', 'النسخ الاحتياطي']] },
        { group: 'الإدارة والمالية', items: [['vendors', '🏭', 'الموردون والمشتريات'], ['cost', '💰', 'المصروفات والتكاليف']] },
        { group: 'إدارة النظام', items: [['itsettings', '⚙️', 'المزامنة والإعدادات'], ['syncerr', '⚠️', 'أخطاء المزامنة'], ['itlog', '🕒', 'سجل الحركات']] },
      ],
    };
  </script>
</head>
<body class="app-it">
  <header class="topbar">
    <button class="icon-btn menu" id="menuBtn" aria-label="القائمة">☰</button>
    <div class="brand"><span class="tb-logo" id="tbLogo"></span> <span class="tb-name" id="tbName"></span></div>
    <div class="gsearch"><input type="search" id="gsearch" placeholder="🔍 بحث: كود، سيريال، موظف، مرشح، مستند... (Ctrl+K)" aria-label="بحث في النظام"><div class="gresults" id="gresults" hidden></div></div>
    <span class="spacer"></span>
    <div class="app-switch-box" id="appSwitch" hidden></div>
    <button class="lang-btn" id="langBtn" data-no-i18n title="Language / اللغة">English</button>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي" title="الوضع الليلي">◐</button>
    <div class="user-box"><span id="userName"></span><button class="btn ghost sm" id="logoutBtn">خروج</button></div>
  </header>
  <aside class="sidebar"><nav class="nav" id="nav"></nav></aside>
  <main id="main" tabindex="-1"></main>
  <div id="toasts" aria-live="polite"></div>
  <div id="print-area"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/protect.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages-it.js"></script>
  <script src="js/pages-it2.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/it-core.js"></script>
  <script src="js/pages-it4.js"></script>
  <script src="js/pages-it5.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/demo-it3.js"></script>
  <script>
    (function () {
      const CFG = window.APP_CONFIG || {};
      // الشريط العلوي من ملف الهوية
      document.getElementById('tbLogo').innerHTML = `<img class="logo-on-light" src="${U.esc(BRAND.logo)}" alt="${U.esc(BRAND.company)}"><img class="logo-on-dark" src="${U.esc(BRAND.logoWhite || BRAND.logo)}" alt="${U.esc(BRAND.company)}">`;
      document.getElementById('tbName').textContent = BRAND.nameNextToLogo ? BRAND.systemName : '';
      // النسخة المستقلة: نظام واحد بس في قايمة الأنظمة والصلاحيات
      UI.APPS.splice(0, UI.APPS.length, { id: 'it', href: 'it.html', ic: '🖥️', name: BRAND.systemName, roles: ['admin', 'it', 'hr', 'accountant', 'marketing'] });
      Store.load();
      if ((CFG.autoDemo || /[?&]demo\b/.test(location.search)) && !DB.customers.length && !DB.assets.length) Store.replace(Demo.load());
      applyBrand(DB);
      const demo = DB.customers.some(c => c.name === 'مقاهي بيت القهوة');
      if (demo && !DB.itInit && !DB.assets.length && !DB.subscriptions.length) Demo.seedIT(DB);
      if (demo && !DB.it2Init && !(DB.lines || []).length && !(DB.mailboxes || []).length) Demo.seedIT2(DB);
      ITX.ensure();
      if (demo && !DB.it3Init && !DB.cycles.length && !DB.tools.length) Demo.seedIT3(DB);
      Store.save();
      if (CFG.hosted) {
        window.confirm = () => true;
        window.prompt = (msg, def) => (def != null ? def : null);
        UI.print = html => UI.modal({ title: 'معاينة المستند', wide: true, body: `<div class="doc-preview">${html}</div>` });
        UI.download = name => UI.toast('التنزيل غير متاح في نسخة العرض (' + name + ')', 'warn');
        document.documentElement.classList.add('hosted');
      }
      // المظهر: حسب الجهاز (افتراضي) ← فاتح ← غامق. «حسب الجهاز» = بدون data-theme فيتبع إعداد الويندوز/الموبايل تلقائيًا.
      const THEMES = { system: ['◐', 'المظهر: حسب الجهاز'], light: ['☀', 'المظهر: فاتح'], dark: ['☾', 'المظهر: غامق'] };
      const readTheme = () => { try { return localStorage.getItem('it_assets_theme') || 'system'; } catch (e) { return 'system'; } };
      const applyTheme = mode => {
        const root = document.documentElement, b = document.getElementById('themeBtn');
        if (mode === 'light' || mode === 'dark') root.dataset.theme = mode; else { delete root.dataset.theme; mode = 'system'; }
        b.textContent = THEMES[mode][0]; b.title = THEMES[mode][1]; b.setAttribute('aria-label', THEMES[mode][1]);
        try { localStorage.setItem('it_assets_theme', mode); } catch (e) {}
      };
      applyTheme(readTheme());
      document.getElementById('themeBtn').onclick = () => {
        const order = ['system', 'light', 'dark'];
        applyTheme(order[(order.indexOf(readTheme()) + 1) % order.length]);
      };
      I18N.init();
      const lb = document.getElementById('langBtn'); lb.textContent = I18N.lang === 'en' ? 'العربية' : 'English'; lb.onclick = () => I18N.toggle();
      const start = user => {
        if (!UI.guard(user)) return;
        ITX.filterNav(user); // الـ HR يشوف دورة الموظف بس
        UI.mountAppSwitch(user);
        Platform.init(user); // الإشعارات
        ITX.init(); // التنبيهات مرة واحدة لكل حدث + Sync Worker
        document.getElementById('userName').textContent = user.name;
        document.getElementById('logoutBtn').onclick = () => { if (confirm('تسجيل الخروج؟')) Auth.logout(); };
        Router.buildNav();
        UI.bindSearch(document.getElementById('gsearch'), document.getElementById('gresults'));
        window.addEventListener('hashchange', Router.render);
        document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
        Router.render();
      };
      const u = Auth.current();
      if (u) start(u); else Auth.showLogin(start);
    })();
  </script>
</body>
</html>
